<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>工e稳袋｜预测与留底实验台</title><style>
:root{--red:#a31827;--ink:#24313b;--muted:#626f77;--bg:#f6f4ee;--line:#dddcd5;--blue:#30638f;--green:#237558;--orange:#955b10}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.6 system-ui,"Microsoft YaHei",sans-serif}main{max-width:1220px;margin:auto;padding:30px 24px 60px}header{display:flex;justify-content:space-between;align-items:center;gap:15px;border-bottom:1px solid var(--line);padding-bottom:22px}h1{font-size:30px;margin:0 0 8px;letter-spacing:-1px}h2{font-size:19px;margin:0 0 10px}h3{font-size:15px;margin:0 0 10px}.sub{color:var(--muted);margin:0}.tag{display:inline-block;background:#fbe8e8;color:#862332;border-radius:8px;padding:6px 12px;font-size:13px}.toolbar{display:flex;align-items:flex-end;flex-wrap:wrap;gap:22px;padding:24px 0}.toolbar label{display:grid;gap:6px;font-weight:600}input,select,button{font:inherit;min-height:44px;border:1px solid #bdc3c5;background:white;border-radius:8px;padding:8px 12px;color:var(--ink)}input[type=number]{width:130px}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}.card{background:#fff;border:1px solid var(--line);border-radius:15px;padding:22px;margin-bottom:18px}.money{font-size:35px;font-weight:750;font-variant-numeric:tabular-nums;margin:8px 0;color:var(--red)}.meta{font-size:13px;color:var(--muted)}.ok{color:var(--green)}.bad{color:var(--red)}.two{display:grid;grid-template-columns:1.05fr 1fr;gap:18px}.notice{border-left:3px solid var(--orange);padding-left:12px;color:var(--orange)}table{border-collapse:collapse;width:100%;font-size:13px}th,td{border-bottom:1px solid #e8e8e3;padding:9px 8px;text-align:right;font-variant-numeric:tabular-nums}th:first-child,td:first-child{text-align:left}thead{background:#f5f5f1}.scroll{overflow:auto}svg{width:100%;height:auto;display:block}.key{display:flex;gap:18px;font-size:13px;margin-top:8px;flex-wrap:wrap}.key span:before{content:'—';font-weight:900;margin-right:6px}details{border-top:1px solid var(--line);padding-top:12px;margin-top:12px}summary{cursor:pointer;min-height:35px}button{cursor:pointer;background:var(--red);color:white;border:0;font-weight:650}button.secondary{background:#eee;color:var(--ink)}button:focus-visible,input:focus-visible,select:focus-visible,summary:focus-visible{outline:3px solid #42799d;outline-offset:2px}.help{line-height:1.8}.small{font-size:13px}.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.muted{color:var(--muted)}pre{white-space:pre-wrap;word-break:break-all;background:#f7f7f4;padding:12px;font-size:12px}.empty{padding:20px;color:var(--muted)}footer{padding-top:18px;color:var(--muted);font-size:13px}@media(max-width:850px){.grid,.two{grid-template-columns:1fr}.money{font-size:31px}main{padding:20px 14px}header{display:block}.tag{margin-top:12px}.toolbar{gap:12px}h1{font-size:24px}th,td{white-space:nowrap}}
</style></head><body><main><header><div><h1>先看钱何时到账，再决定今晚拿多少。</h1><p class="sub">工e稳袋 · 预测与留底实验台</p></div><div class="tag">离线模拟 · 无银行接口</div></header>
<div class="toolbar"><label>模拟商户<select id="merchant"></select></label><label>当前可用余额（元）<input id="opening" type="number" min="0" max="1000000" step="100" value="3600"></label><label>指定结算延迟（自然日）<input id="delay" type="number" min="0" max="8" step="1" value="2"></label><button id="reset" class="secondary">恢复演示数据</button></div>
<div id="app" aria-live="polite"></div><footer>全部商户、流水、结算与误差数据均为固定种子模拟。方法为成熟统计方法的应用；本演示不提供真实准确率、未来覆盖概率、授信或信用评分。预测只展示，不增加当前可提用金额。</footer>
</main><script>/* CORE_BUNDLE */</script><script>/* DEMO_UI */</script></body></html>

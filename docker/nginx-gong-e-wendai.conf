# 工 e 稳袋 (gong-e-wendai) — Nginx 站点配置
#
# 部署方式（服务器上执行，需要 sudo）：
#   sudo cp docker/nginx-gong-e-wendai.conf /etc/nginx/conf.d/gong-e-wendai.conf
#   sudo nginx -t && sudo systemctl reload nginx
#
# 设计说明：
# * 本平台使用**独立端口 18088**，新增独立 server 块，不新增 server_name，
#   不改动任何已有站点配置（80 端口已由既有 fitness 站点以 server_name 占用）。
# * 应用进程只监听 127.0.0.1:18089，由 Nginx 反向代理对外提供 18088。
# * 公网能否访问 18088 取决于云厂商安全组是否放行该端口。
# * 前端与 API 同源，因此不需要额外的 CORS 配置。

server {
    listen       18088;
    listen       [::]:18088;
    server_name  _;

    access_log /var/log/nginx/gong-e-wendai.access.log;
    error_log  /var/log/nginx/gong-e-wendai.error.log;

    # 与后端 MAX_UPLOAD_MB 保持一致并留出余量
    client_max_body_size 8m;

    # ------------------------------------------------------------------
    # 压缩传输
    #
    # 注意：全局 nginx.conf 里的 `gzip on;` 只压缩 text/html，
    # 因为 `gzip_types` 被注释掉了。默认配置下本项目 2.2MB 的 JS/CSS
    # 会以未压缩形式传输，公网首屏会明显变慢。
    #
    # 另外，应用返回的 JS Content-Type 是 `text/javascript`（不是
    # `application/javascript`），两个都要写进 gzip_types，否则 JS 不会被压缩。
    #
    # 只在本 server / 本项目生效，不影响其他既有站点。
    # ------------------------------------------------------------------
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/javascript application/javascript
               application/json image/svg+xml application/xml text/xml;

    # 静态资源长缓存（文件名带内容哈希）
    # 注意：location 之间不继承指令，gzip 需要在这里重复声明一次。
    location /assets/ {
        proxy_pass         http://127.0.0.1:18089;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;

        gzip on;
        gzip_vary on;
        gzip_proxied any;
        gzip_comp_level 6;
        gzip_min_length 1024;
        gzip_types text/plain text/css text/javascript application/javascript
                   application/json image/svg+xml application/xml text/xml;

        # 只用 add_header 下发，避免与 expires 生成第二条 Cache-Control
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # 其余请求（页面、SPA 路由、/api/*）统一反代到应用
    location / {
        proxy_pass         http://127.0.0.1:18089;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   Upgrade           $http_upgrade;
        proxy_set_header   Connection        "upgrade";
        proxy_read_timeout 60s;
    }
}

# 工 e 稳袋 (gong-e-wendai) — Nginx 站点配置
#
# 部署方式（服务器上执行，需要 sudo）：
#   sudo cp docker/nginx-gong-e-wendai.conf /etc/nginx/conf.d/gong-e-wendai.conf
#   sudo nginx -t && sudo systemctl reload nginx
#
# 设计说明：
# * 本平台使用**独立端口 18088**，新增独立 server 块，不新增 server_name，
#   不改动任何已有站点配置（80 端口已由既有 fitness 站点以 server_name 占用）。
# * 应用进程只监听 127.0.0.1:18089，由 Nginx 反向代理对外提供 18088。
# * 公网能否访问 18088 取决于云厂商安全组是否放行该端口。
# * 前端与 API 同源，因此不需要额外的 CORS 配置。

server {
    listen       18088;
    listen       [::]:18088;
    server_name  _;

    access_log /var/log/nginx/gong-e-wendai.access.log;
    error_log  /var/log/nginx/gong-e-wendai.error.log;

    # 与后端 MAX_UPLOAD_MB 保持一致并留出余量
    client_max_body_size 8m;

    # 静态资源长缓存（文件名带内容哈希）
    location /assets/ {
        proxy_pass         http://127.0.0.1:18089;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # 其余请求（页面、SPA 路由、/api/*）统一反代到应用
    location / {
        proxy_pass         http://127.0.0.1:18089;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   Upgrade           $http_upgrade;
        proxy_set_header   Connection        "upgrade";
        proxy_read_timeout 60s;
    }
}
